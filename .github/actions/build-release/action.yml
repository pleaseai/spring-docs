name: Build release archive
description: >-
  Fetch one upstream (project, version) pair, convert it to Markdown and package
  the archive. Shared by matrix-build.yml and release.yml so a published archive
  is produced by exactly the same steps that were exercised in the matrix build.

inputs:
  project:
    description: Catalog project key, e.g. boot
    required: true
  version:
    description: GA version, e.g. 4.1.1
    required: true

outputs:
  archive:
    description: Path to the built archive
    value: ${{ steps.package.outputs.archive }}
  sha256:
    description: SHA-256 of the archive
    value: ${{ steps.package.outputs.sha256 }}

runs:
  using: composite
  steps:
    - name: Fetch upstream
      shell: bash
      run: bun run scripts/fetch-upstream.ts "${{ inputs.project }}" "${{ inputs.version }}" --out dist/upstream

    - name: Convert to Markdown
      shell: bash
      # --strict: an unhandled AsciiDoc construct is a pipeline bug, not a warning
      # to page past (ARCHITECTURE: no silent fallbacks).
      run: |
        bun run scripts/convert.ts "dist/upstream/${{ inputs.project }}-${{ inputs.version }}" \
          --project "${{ inputs.project }}" \
          --version "${{ inputs.version }}" \
          --out dist \
          --strict

    - name: Package
      id: package
      shell: bash
      run: |
        set -euo pipefail
        name="${{ inputs.project }}-${{ inputs.version }}"
        bun run scripts/package-release.ts "dist/$name" --out releases
        echo "archive=releases/$name.tar.gz" >> "$GITHUB_OUTPUT"
        echo "sha256=$(cut -d' ' -f1 < "releases/$name.tar.gz.sha256")" >> "$GITHUB_OUTPUT"

    - name: Verify the checksum the archive ships with
      shell: bash
      working-directory: releases
      run: sha256sum --check "${{ inputs.project }}-${{ inputs.version }}.tar.gz.sha256"
