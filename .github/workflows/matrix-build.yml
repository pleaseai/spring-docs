name: Matrix Build

# Builds N projects x M versions in parallel. Publishes nothing: the archives
# are uploaded as workflow artifacts for inspection. Publishing is release.yml's
# job, and it rebuilds from the tag rather than trusting an artifact from here.

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project key to build (blank = every supported project)
        type: string
        required: false
        default: ''
      limit:
        description: Newest N missing versions per project
        type: string
        required: false
        default: '3'
  schedule:
    # Weekly, after nightly-detect has had a chance to file issues.
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: matrix-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect versions to build
        id: detect
        env:
          PROJECT: ${{ inputs.project }}
          LIMIT: ${{ inputs.limit || '3' }}
        run: |
          set -euo pipefail
          args=(--json --limit "$LIMIT")
          if [ -n "$PROJECT" ]; then args+=(--project "$PROJECT"); fi
          matrix="$(bun run scripts/detect-upstream-versions.ts "${args[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$matrix" | jq '.include | length')" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  build:
    name: ${{ matrix.project }} ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        uses: ./.github/actions/build-release
        with:
          project: ${{ matrix.project }}
          version: ${{ matrix.version }}

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.project }}-${{ matrix.version }}
          path: releases/
          if-no-files-found: error
          retention-days: 14
