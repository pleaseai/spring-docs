name: Release

# Publishes one (project, version) archive. The tag is the trigger and the
# source of truth: `<project>-<version>` — or `<project>-<version>+rebuild.N`
# when correcting an archive, since a published tag is never moved.
#
# The archive is rebuilt here from the upstream commit rather than promoted from
# a matrix-build artifact, so what ships is produced by the release run itself.

on:
  push:
    tags:
      - '*-[0-9]+.[0-9]+.[0-9]+'
      - '*-[0-9]+.[0-9]+.[0-9]+\+*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Parse the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          project="${TAG%%-*}"
          rest="${TAG#*-}"
          version="${rest%%+*}"
          if [ -z "$project" ] || [ -z "$version" ]; then
            echo "::error::Tag '$TAG' is not <project>-<version>" >&2
            exit 1
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; tags are immutable. Publish a +rebuild.N tag." >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        uses: ./.github/actions/build-release
        with:
          project: ${{ steps.tag.outputs.project }}
          version: ${{ steps.tag.outputs.version }}

      - name: Check the manifest against the tag
        env:
          PROJECT: ${{ steps.tag.outputs.project }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          jq -e --arg p "$PROJECT" --arg v "$VERSION" \
            '.project == $p and .version == $v' releases/manifest.json > /dev/null

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PROJECT: ${{ steps.tag.outputs.project }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          name="$PROJECT-$VERSION"
          gh release create "$TAG" \
            --title "$PROJECT $VERSION" \
            --notes "Converted documentation for $PROJECT $VERSION. Provenance and checksums are in \`manifest.json\`." \
            "releases/$name.tar.gz" \
            "releases/$name.tar.gz.sha256" \
            "releases/manifest.json"

      # Only after the release exists: a failed release must not update the catalog.
      - name: Record the release in catalog.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PROJECT: ${{ steps.tag.outputs.project }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          released_at="$(gh release view "$TAG" --json publishedAt --jq .publishedAt)"
          branch="catalog/$TAG"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"

          bun run scripts/update-catalog.ts \
            --project "$PROJECT" --version "$VERSION" --tag "$TAG" --released-at "$released_at"
          bun run validate-catalog

          # The committed tree is what makes a rebuild's effect reviewable as a diff.
          bun run scripts/promote-markdown.ts "dist/$PROJECT-$VERSION"

          git add catalog.json "markdown/$PROJECT/$VERSION"
          git commit -m "chore(catalog): record $TAG"
          git push origin "$branch"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore(catalog): record $TAG" \
            --body "Adds \`$PROJECT $VERSION\` → \`$TAG\` and the converted tree under \`markdown/$PROJECT/$VERSION/\`, published by the release workflow."
