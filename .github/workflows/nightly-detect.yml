name: Nightly Detect

# Polls upstream for GA releases the catalog does not carry and files one issue
# per missing (project, version). Builds nothing: a human decides what to build,
# because a new upstream line can change the documentation layout.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-detect
  cancel-in-progress: true

jobs:
  detect:
    name: Detect new upstream versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect
        id: detect
        run: |
          set -euo pipefail
          matrix="$(bun run scripts/detect-upstream-versions.ts --json --limit 5)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

      - name: File an issue per missing version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MATRIX: ${{ steps.detect.outputs.matrix }}
        run: |
          set -euo pipefail
          echo "$MATRIX" | jq -r '.include[] | "\(.project)\t\(.version)"' | \
          while IFS=$'\t' read -r project version; do
            title="Build $project $version"

            # `--search` matches the title loosely, so the result is filtered exactly:
            # "Build boot 4.1.1" must not be satisfied by "Build boot 4.1.10".
            existing="$(gh issue list --repo "$REPO" --state all --limit 100 \
              --search "$title in:title" \
              --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
            if [ -n "$existing" ]; then
              echo "$title — already tracked in #$existing"
              continue
            fi

            # `gh issue create` prints the new issue's URL, not JSON.
            url="$(gh issue create --repo "$REPO" \
              --title "$title" \
              --body "$(printf '%s\n' \
                "Upstream published a GA release the catalog does not carry yet." \
                "" \
                "- project: \`$project\`" \
                "- version: \`$version\`" \
                "" \
                "Run the \`Matrix Build\` workflow to verify conversion, then push the tag \`$project-$version\` to publish." \
                "" \
                "_Filed automatically by \`nightly-detect.yml\`._")")"
            number="${url##*/}"
            echo "$title — filed as #$number"

            # This organization requires the Priority and Importance issue fields
            # (ADR-0013); p0-p3 labels are not accepted. The endpoint takes a JSON
            # body that `-f` cannot express, so it is piped in.
            printf '%s' \
              '{"issue_field_values":[{"field_id":36815746,"value":"Medium"},{"field_id":45816746,"value":"Low"}]}' \
              | gh api "repos/$REPO/issues/$number/issue-field-values" -X POST --input -
          done
